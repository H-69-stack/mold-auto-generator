<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型查看与测量系统</title>
    <script type="importmap">
        {
            "imports": {
                "three": "/static/vendor/three/build/three.module.js",
                "three/addons/": "/static/vendor/three/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --primary:#4f8cf7; --primary-dark:#3a6fd8; --primary-bg:#eaf1ff;
            --bg:#f0f2f5; --surface:#fff; --border:#dde1e7; --text:#1b2534; --text2:#68748a; --text3:#9aa7ba;
            --shadow:0 2px 10px rgba(0,0,0,0.07); --radius:8px;
        }
        * {margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);height:100vh;overflow:hidden;color:var(--text)}
        /* ===== Header ===== */
        .header{height:50px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:50}
        .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#4f8cf7,#6c5ce7);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
        .logo-txt{font-weight:700;font-size:15px}
        .logo-sub{font-size:11px;color:var(--text3);padding-left:8px;border-left:1px solid var(--border)}
        .spacer{flex:1}
        .header-actions{display:flex;gap:6px}
        .ha-btn{padding:7px 12px;border:1px solid var(--border);background:var(--bg);border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--text2);transition:.15s}
        .ha-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
        .ha-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        /* ===== Layout ===== */
        .layout{display:flex;height:calc(100vh - 50px)}
        /* ===== Left tree panel ===== */
        .tree-panel{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
        /* 左侧功能模块列表 */
        .fn-list{display:flex;flex-direction:column;gap:3px;padding:8px;border-bottom:1px solid var(--border);flex-shrink:0}
        .fn-btn{padding:8px 10px;border:none;background:var(--bg);border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--text2);text-align:left;transition:.15s}
        .fn-btn:hover{background:var(--primary-bg);color:var(--primary)}
        .fn-btn.active{background:var(--primary);color:#fff}
        .tree-head{padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
        .tree-head .badge{font-size:10px;background:var(--primary-bg);color:var(--primary);padding:1px 7px;border-radius:10px;font-weight:600}
        .tree-box{flex:1;overflow-y:auto;padding:6px}
        .tree-box::-webkit-scrollbar{width:5px}
        .tree-box::-webkit-scrollbar-thumb{background:#ccd2dc;border-radius:3px}
        .tree-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.8px;user-select:none}
        .tree-item:hover{background:var(--primary-bg)}
        .tree-item.sel{background:var(--primary-bg);box-shadow:inset 2px 0 0 var(--primary)}
        .tree-item .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex-shrink:0}
        .tree-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .tree-item .tri{font-size:10.5px;color:var(--text3)}
        .tree-item .eye{cursor:pointer;font-size:13px;color:var(--text3);width:18px;text-align:center;border-radius:4px}
        .tree-item .eye:hover{background:#fff;color:var(--text)}
        .tree-item .lens{cursor:pointer;font-size:13px;color:var(--text3);width:18px;text-align:center;border-radius:4px}
        .tree-item .lens:hover{background:#fff;color:var(--primary)}
        .tree-foot{padding:8px;border-top:1px solid var(--border);display:flex;gap:6px}
        .tf-btn{flex:1;padding:6px;font-size:11.5px;border:1px solid var(--border);background:var(--bg);border-radius:6px;cursor:pointer;color:var(--text2)}
        .tf-btn:hover{color:var(--primary);border-color:var(--primary)}
        /* ===== Viewer ===== */
        .viewer-wrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#94a7bf 0%,#6b7c95 100%)}
        #viewer{width:100%;height:100%}
        /* top-right toolbar */
        .vtool{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:3px;z-index:10}
        .vtool button{width:44px;height:44px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:7px;cursor:pointer;font-size:17px;box-shadow:var(--shadow);transition:.15s}
        .vtool button:hover{background:#fff;transform:translateY(-1px)}
        .vtool button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .vtool .sep{height:1px;background:var(--border);margin:2px 8px}
        /* bottom toolbar */
        .btool{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:12px;padding:5px 8px;box-shadow:var(--shadow);z-index:10;border:1px solid rgba(255,255,255,.6)}
        .btool button{width:42px;height:42px;border:none;background:transparent;border-radius:7px;cursor:pointer;font-size:17px;color:#5a6678;transition:.15s}
        .btool button:hover{background:rgba(0,0,0,.06)}
        .btool button.active{background:var(--primary);color:#fff}
        .btool .sep{width:1px;background:var(--border);margin:0 3px}
        /* view cube */
        .viewcube{position:absolute;bottom:70px;right:12px;width:74px;height:74px;z-index:10;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-radius:7px;display:flex;flex-wrap:wrap;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6)}
        .viewcube div{width:33.33%;height:33.33%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#5a6678;cursor:pointer;border:1px solid rgba(0,0,0,.03);transition:.12s}
        .viewcube div:hover{background:var(--primary-bg);color:var(--primary)}
        .viewcube div.home{background:var(--primary);color:#fff}
        /* status bar */
        .status{position:absolute;bottom:0;left:0;right:0;height:22px;background:rgba(20,28,40,.18);backdrop-filter:blur(3px);font-size:11px;color:#eef2f8;display:flex;align-items:center;gap:14px;padding:0 12px;z-index:10;pointer-events:none}
        .status .sp{color:rgba(255,255,255,.35)}
        .status .tri{margin-left:auto}
        /* property panel */
        .prop-panel{position:absolute;top:10px;left:10px;width:250px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;z-index:20;display:none;font-size:12.3px;border:1px solid rgba(255,255,255,.7)}
        .prop-panel h4{font-size:12.8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
        .prop-panel .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--border)}
        .prop-panel .row .k{color:var(--text2)}
        .prop-panel .row .v{font-weight:600}
        .prop-close{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);margin-left:auto}
        .prop-close:hover{color:var(--text)}
        /* loading */
        .loading{position:absolute;inset:0;background:rgba(30,40,55,.35);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100}
        .loading.show{display:flex}
        .spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
        @keyframes sp{to{transform:rotate(360deg)}}
        /* side panels (工程功能) */
        .panel-backdrop{position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.12);display:none}
        .panel-backdrop.show{display:block}
        .panels{position:absolute;left:0;top:0;bottom:0;width:280px;background:var(--surface);border-right:1px solid var(--border);z-index:30;display:none;flex-direction:column;box-shadow:3px 0 18px rgba(0,0,0,.08)}
        .panels.show{display:flex}
        .panels .ph{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
        .panels .ph button{margin-left:auto;background:none;border:none;cursor:pointer;font-size:15px;color:var(--text3)}
        .panels .pb{flex:1;overflow-y:auto;padding:14px}
        .panels label.f{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}
        .panels input[type=number],.panels input[type=text],.panels select{width:100%;padding:8px 10px;border:1.4px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none}
        .panels input:focus{border-color:var(--primary)}
        .btn{display:block;width:100%;padding:9px;border:none;border-radius:7px;background:linear-gradient(135deg,#4f8cf7,#6c5ce7);color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;transition:.2s}
        .btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,140,247,.35)}
        .btn.small{padding:7px;font-size:12px}
        .panels .hint{font-size:11.5px;color:var(--text3);margin-top:5px;line-height:1.5}
        .status-msg{border-radius:7px;padding:8px 10px;font-size:12px;margin-top:10px;display:none;line-height:1.5}
        .status-msg.show{display:block}
        .status-msg.ok{background:#e9f9ef;color:#0a6e35;border:1px solid #b7ecd0}
        .status-msg.err{background:#fdecec;color:#a11;border:1px solid #f6c6c6}
        .status-msg.info{background:var(--primary-bg);color:var(--primary-dark);border:1px solid #c9ddfd}
        .panel-body label.f:first-child{margin-top:0}
        /* ===== 剖切查看面板 ===== */
        .sect-panel{position:absolute;top:10px;left:10px;width:220px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;z-index:20;font-size:12px;border:1px solid rgba(255,255,255,.7);display:none}
        .sect-panel .sect-close{background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);margin-left:auto}
        .sect-panel .sect-close:hover{color:var(--text)}
        .sect-panel .sect-lbl{display:block;font-size:11.5px;font-weight:600;margin:8px 0 4px;color:var(--text2)}
        .sect-panel .sect-ax{flex:1;padding:6px;font-size:11px;border:1px solid var(--border);background:var(--bg);border-radius:6px;cursor:pointer;color:var(--text2)}
        .sect-panel .sect-ax.active{background:var(--primary);color:#fff;border-color:var(--primary)}
        .sect-panel .sect-apply{width:100%;padding:8px;border:none;border-radius:7px;background:linear-gradient(135deg,#4f8cf7,#6c5ce7);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:10px;transition:.2s}
        .sect-panel .sect-apply:hover{box-shadow:0 4px 12px rgba(79,140,247,.35)}
        .sect-panel .sect-restore{width:100%;padding:7px;border:1px solid var(--border);background:var(--bg);border-radius:7px;font-size:12px;cursor:pointer;color:var(--text2);margin-top:6px}
        .sect-panel .sect-restore:hover{color:var(--primary);border-color:var(--primary)}
        .vtool button.sect-on{background:var(--primary);color:#fff;border-color:var(--primary)}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">3D</div>
        <div class="logo-txt">三维模型查看系统</div>
        <span class="logo-sub">OpenCASCADE</span>
        <div class="spacer"></div>
        <div class="header-actions">
            <!-- 只保留这条主线：上传/三维查看 → 镜像 → 智能模具（管件→上模/下模/芯棒/四件套） -->
            <button class="ha-btn" data-panel="upload">📂 上传模型</button>
            <button class="ha-btn" data-panel="smart_mold">🤖 智能模具</button>
            <button class="ha-btn" data-panel="mirror">🪞 镜像</button>
        </div>
    </div>
    <div class="layout">
        <!-- 左侧：功能模块 + 模型树 -->
        <div class="tree-panel">
            <div class="fn-list" id="fnList">
                <button class="fn-btn" data-panel="upload">📂 上传模型</button>
                <button class="fn-btn" data-panel="smart_mold">🤖 智能模具</button>
                <button class="fn-btn" data-panel="mirror">🪞 镜像</button>
            </div>
            <div class="tree-head">🎄 模型树 <span class="badge" id="treeCount">0 实体</span></div>
            <div class="tree-box" id="treeBox"><div style="color:var(--text3);font-size:12px;padding:10px">尚未加载模型 — 点击上方「上传模型」</div></div>
            <div class="tree-foot">
                <button class="tf-btn" id="showAllBtn">👁 全部显示</button>
                <button class="tf-btn" id="hideAllBtn">🚫 全部隐藏</button>
            </div>
        </div>
        <!-- 3D 视图 -->
        <div class="viewer-wrap">
            <div id="viewer"></div>
            <div class="loading" id="loading"><div class="spin"></div></div>
            <!-- 右侧工具 -->
            <div class="vtool">
                <button id="fitBtn" title="适配模型">⊞</button>
                <button id="axisBtn" title="坐标轴">⊕</button>
                <div class="sep"></div>
                <button id="isoBtn" title="等轴测">◈</button>
                <button id="frontBtn" title="前视图">▣</button>
                <button id="topBtn" title="俯视图">▤</button>
                <button id="leftBtn" title="左视图">▥</button>
                <div class="sep"></div>
                <button id="sectBtn" title="剖切查看内部型腔" class="active">🔍</button>
            </div>
            <!-- 底部工具 -->
            <div class="btool">
                <button id="rotateBtn" title="自动旋转">⟳</button>
                <button id="gridBtn" title="网格" class="active">⊞</button>
                <button id="wireBtn" title="线框 (W)">◇</button>
                <button id="edgeBtn" title="边线 (E)" class="active">‖</button>
                <div class="sep"></div>
                <button id="panBtn" title="平移模式：点击后用左键拖动平移 (P)">✥</button>
                <button id="liveBtn" title="实时位置：鼠标悬停显示所在封闭面 (L)">◎</button>
                <button id="markBtn" title="表面标注：上红/下蓝/侧橙 (S)">🎨</button>
                <div class="sep"></div>
                <button id="semiBtn" title="半透明">◐</button>
                <button id="matBtn" title="材质">🧪</button>
            </div>
            <!-- 视图立方体 -->
            <div class="viewcube" id="viewcube">
                <div data-v="front">前</div><div data-v="top">上</div><div data-v="right">右</div>
                <div data-v="bottom">下</div><div class="home" data-v="home">3D</div><div data-v="left">左</div>
                <div data-v="back">后</div><div data-v="iso">轴</div><div data-v="reset">复</div>
            </div>
            <!-- 属性面板 -->
            <div class="prop-panel" id="propPanel">
                <h4>🔍 选中对象 <button class="prop-close" onclick="closeProp()">✕</button></h4>
                <div id="propBody"></div>
            </div>
            <!-- 剖切查看内部型腔面板 -->
            <div class="sect-panel" id="sectPanel">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
                    <b style="font-size:12.8px">🔍 剖切查看内部型腔</b>
                    <button class="sect-close" onclick="closeSectPanel()">✕</button>
                </div>
                <label class="sect-lbl">剖切方向</label>
                <div style="display:flex;gap:5px;margin-bottom:6px">
                    <button class="sect-ax" data-ax="x">X 纵向</button>
                    <button class="sect-ax" data-ax="y">Y 横向</button>
                    <button class="sect-ax" data-ax="z">Z 水平</button>
                </div>
                <label class="sect-lbl">剖切位置: <span id="sectRatioV">0.50</span></label>
                <input type="range" id="sectRatio" min="0.1" max="0.9" step="0.01" value="0.5" style="width:100%">
                <button class="sect-apply" id="sectApply">✂️ 应用半剖</button>
                <button class="sect-restore" id="sectRestore">🔄 还原完整模型</button>
            </div>
            <!-- 状态栏 -->
            <div class="status">
                <span id="stMode">就绪</span><span class="sp">|</span><span id="stInfo">无模型</span><span class="sp">|</span>
                <span>拖拽旋转 · 滚轮缩放 · 右键平移</span><span class="tri" id="stTri"></span>
            </div>
            <!-- 面板遮罩层（点击关闭） -->
            <div class="panel-backdrop" id="panelBackdrop" onclick="closePanel()"></div>
            <!-- 工程功能面板 -->
            <div class="panels" id="panels">
                <div class="ph" id="panelTitle">📂 上传模型 <button onclick="closePanel()">✕</button></div>
                <div class="pb" id="panelBody"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Line2 } from 'three/addons/lines/Line2.js';
        import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
        import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
        import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
        import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        /* 长任务提交：POST 拿 task_id，然后轮询 /api/task_status
           —— 大件（757mm 管件）要跑 8~15 分钟，单次同步请求会被浏览器/代理掐断，
              以前就是这样误报"生成超时（4分钟）"而服务器其实还在算。 */
        async function submitTask(url,payload,onTick){
            const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
            let d=await resp.json();
            if(d.error)throw new Error(d.error);
            if(!d.async)return d;
            const tid=d.task_id,t0=Date.now();
            for(let i=0;;i++){
                await new Promise(r=>setTimeout(r,3000));
                let st;
                try{ st=await (await fetch('/api/task_status?task_id='+encodeURIComponent(tid))).json(); }
                catch(e){ continue; }
                if(st.error&&st.state!=='error')throw new Error(st.error);
                if(onTick)onTick(st,Math.round((Date.now()-t0)/1000));
                if(st.state==='done')return st;
                if(st.state==='error')throw new Error(st.error||'任务失败');
            }
        }

        /* ================= 场景 ================= */
        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        // 竖向渐变背景（顶部冷灰蓝、底部亮白），比纯色更有层次，衬托实体轮廓
        (function(){
            const c=document.createElement('canvas'); c.width=2; c.height=512;
            const g=c.getContext('2d'); const grd=g.createLinearGradient(0,0,0,512);
            grd.addColorStop(0,'#e9ebee'); grd.addColorStop(0.5,'#f1f2f4'); grd.addColorStop(1,'#fafbfc');
            g.fillStyle=grd; g.fillRect(0,0,2,512);
            const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace;
            scene.background=tx;
        })();
        const camera = new THREE.PerspectiveCamera(40, container.clientWidth/container.clientHeight, 0.1, 1e6);
        camera.position.set(180,140,240);
        const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
        renderer.setSize(container.clientWidth, container.clientHeight);
        // 像素比上限 2.0：4K 屏也不至于让 GPU 填充压力过大导致卡顿
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2.0));
        renderer.toneMapping = THREE.NoToneMapping;   // CAD 工程图风格：平直明亮，避免 ACES 压暗/高对比
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.samples = 4;
        container.appendChild(renderer.domElement);

        // 实体感关键：HDR 环境反射贴图。
        // 让材质反射环境光形成连续流动的高光，曲面不再灰平发虚，而是像真实实体一样有立体光泽
        {
            const pmrem = new THREE.PMREMGenerator(renderer);
            const envScene = new RoomEnvironment();
            scene.environment = pmrem.fromScene(envScene, 0.04).texture;
            pmrem.dispose();
        }

        // CAD 工程图风格布光：柔和、低对比，避免强高光/硬阴影
        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe3e8, 0.55));
        const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(180,300,240); scene.add(key);
        const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-220,120,-160); scene.add(fill);
        const rim = new THREE.DirectionalLight(0xffffff, 0.4); rim.position.set(-60,180,-260); scene.add(rim);

        /* ================= 工具函数 ================= */
        const matCache={};

        // CAD 工程图风格材质：哑光（高粗糙度、零金属/清漆），浅灰表面柔和受光，贴近参考图效果

        function getMat(color){ const k=color.join(','); if(!matCache[k])matCache[k]=new THREE.MeshStandardMaterial({color:new THREE.Color(...color),metalness:0.0,roughness:0.96,flatShading:false,side:THREE.DoubleSide,envMapIntensity:0.15,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}); return matCache[k]; }

            (function an(){const t=Math.min((Date.now()-t0)/300,1),ease=t*(2-t);camera.position.lerpVectors(s,e,ease);controls.target.set(0,0,0);controls.update();if(t<1)requestAnimationFrame(an);})();}
        function showStatus(msg,type,el){if(typeof el==='string')el=document.getElementById(el);if(!el)el=document.getElementById('panelStatus');if(!el)return;el.className='status-msg show '+(type||'info');el.textContent=msg;}

        /* ================= 法线分裂：硬边锐利 + 曲面平滑 ================= */
        // 直接 computeVertexNormals 会把共享顶点的相邻面法线平均，导致 90° 折弯等硬边被
        // “抹圆”、边缘发糊。此函数按两面夹角阈值分裂共享顶点：夹角 < 阈值(平滑区，如圆角)
        // 继续平滑；夹角 ≥ 阈值(硬边)各自独立法线，从而同时得到锐利棱边 + 圆角连续曲面。
        function computeSplitNormals(geo, thresholdDeg){
            thresholdDeg = thresholdDeg || 40;
            const pos = geo.getAttribute('position');
            const index = geo.getIndex();
            if(!index){ geo.computeVertexNormals(); return geo; }
            const triCount = index.count/3;
            const fn = new Float32Array(triCount*3);
            const A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3(),e1=new THREE.Vector3(),e2=new THREE.Vector3(),n=new THREE.Vector3();
            for(let t=0;t<triCount;t++){
                A.fromBufferAttribute(pos,index.getX(t*3));
                B.fromBufferAttribute(pos,index.getX(t*3+1));
                C.fromBufferAttribute(pos,index.getX(t*3+2));
                e1.subVectors(B,A); e2.subVectors(C,A); n.crossVectors(e1,e2).normalize();
                fn[t*3]=n.x; fn[t*3+1]=n.y; fn[t*3+2]=n.z;
            }
            const vertTris=new Map();
            for(let t=0;t<triCount;t++)for(let k=0;k<3;k++){
                const v=index.getX(t*3+k); let a=vertTris.get(v); if(!a){a=[];vertTris.set(v,a);} a.push(t);
            }
            const cosT=Math.cos(thresholdDeg*Math.PI/180);
            const outPos=[],outNrm=[],outIdx=[];
            const keyMap=new Map();
            vertTris.forEach((tris,v)=>{
                const cnt=tris.length;
                const parent=new Int32Array(cnt); for(let i=0;i<cnt;i++)parent[i]=i;
                const find=x=>{let r=x;while(parent[r]!==r)r=parent[r];while(parent[x]!==r){const p=parent[x];parent[x]=r;x=p;}return r;};
                for(let i=0;i<cnt;i++)for(let j=i+1;j<cnt;j++){
                    const t1=tris[i],t2=tris[j];
                    const d=fn[t1*3]*fn[t2*3]+fn[t1*3+1]*fn[t2*3+1]+fn[t1*3+2]*fn[t2*3+2];
                    if(d>cosT){const ri=find(i),rj=find(j);if(ri!==rj)parent[ri]=rj;}
                }
                const rep=new Map();
                for(let i=0;i<cnt;i++){
                    const r=find(i);
                    let gv=rep.get(r);
                    if(gv===undefined){
                        let sx=0,sy=0,sz=0;
                        for(let j=0;j<cnt;j++)if(find(j)===r){const t=tris[j];sx+=fn[t*3];sy+=fn[t*3+1];sz+=fn[t*3+2];}
                        const l=Math.hypot(sx,sy,sz)||1;

                        outNrm.push(sx/l,sy/l,sz/l);

                }
            });

                outIdx.push(keyMap.get(index.getX(t*3+k)+':'+t));
            }
            geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(outPos),3));

        }

        /* ================= 顶点焊接：缝合相邻面缝隙（修复「线条断裂/面发噪」） ================= */
        // OCCT 对每个面单独网格化，相邻面共享边上的顶点坐标并不完全一致（差 1e-4~1e-2mm），
        // 这些“裂缝”会让 EdgesGeometry 把缝当成边界画出一圈圈碎线，同时光照在缝处断裂产生噪点。
        // 此函数把容差内的近重合顶点合并为一个，彻底闭合裂缝 → 边线干净、曲面平滑。
        function weldBufferGeometry(geo, relTol){
            const pos=geo.getAttribute('position');
            const index=geo.getIndex();
            if(!index) return geo;
            // 注意：three r160 的 BufferAttribute 没有 computeBoundingBox，边界盒要由几何体来算。
            // （S2 原版这里写成 pos.computeBoundingBox() 会抛异常被外层 catch 吞掉，
            //   导致焊接永远静默回退——即“焊接”实际从未执行过。此处按源码本意修正。）
            geo.computeBoundingBox();
            const bb=geo.boundingBox;
            const size=Math.max(bb.max.x-bb.min.x, bb.max.y-bb.min.y, bb.max.z-bb.min.z)||1;
            const tol=Math.max(1e-3, Math.min((relTol||1e-4)*size, 0.05));   // 容差随模型尺度缩放并封顶
            const inv=1/tol;
            const map=new Map(), oldToNew=new Int32Array(pos.count), outPos=[];
            for(let i=0;i<pos.count;i++){
                const key=Math.round(pos.getX(i)*inv)+'_'+Math.round(pos.getY(i)*inv)+'_'+Math.round(pos.getZ(i)*inv);
                let gi=map.get(key);
                if(gi===undefined){ gi=outPos.length/3; map.set(key,gi); outPos.push(pos.getX(i),pos.getY(i),pos.getZ(i)); }
                oldToNew[i]=gi;
            }
            const idx=index.array, out=[]; let merged=0;
            for(let i=0;i<idx.length;i+=3){
                const a=oldToNew[idx[i]], b=oldToNew[idx[i+1]], c=oldToNew[idx[i+2]];
                if(a===b||b===c||a===c){ merged++; continue; }   // 去除退化三角形
                out.push(a,b,c);
            }
            if(!out.length || out.length===idx.length && pos.count===outPos.length/3) return geo;
            geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(outPos),3));
            geo.setIndex(new THREE.BufferAttribute(new Uint32Array(out),1));
            return geo;
        }

        /* ================= 落地：网格与地面软阴影贴合模型底部 ================= */
        function updateGround(){
            if(!curInfo){ groundShadow.visible=false; return; }
            const bb=new THREE.Box3().setFromObject(modelGroup);
            if(bb.isEmpty()){ groundShadow.visible=false; return; }
            const mn=bb.min, mx=bb.max;

            const cx=(mn.x+mx.x)/2, cz=(mn.z+mx.z)/2;

        /* ================= 自适应渲染质量 ================= */

        function adaptQuality(totalT){
            let px = Math.min(devicePixelRatio, 2.0);

        /* ================= 模型加载 ================= */
        function clearAll(){

            bodyEntries=[];clickableMeshes=[];showMark=false;document.getElementById('markBtn').classList.remove('active');
            document.getElementById('treeBox').innerHTML='<div style="color:var(--text3);font-size:12px;padding:10px">尚未加载模型</div>';
            document.getElementById('treeCount').textContent='0 实体';
        }
        const BIG_MODEL_TRIS = 300000;  // 超过此面数进入"大模型快速模式"：跳过重建/标注/逐边线
        // 用后端返回的真实 BREP 拓扑边绘制 CAD 特征线（圆盘/圆槽/孔的完整轮廓与切边）。
        // 每条边是采样的折线顶点 [x,y,z,...]，连成线段对后用 LineSegments2 渲染。
        // 这是 CAD 视图的关键：EdgesGeometry 只能按三角网格二面角推断，会丢失切边(tangent edge)
        // 与轮廓边(silhouette)，导致圆盘/圆槽边框缺失；拓扑边则完整、准确且与视角无关。
        // 用 LineSegments2（fat line）替代 LineBasicMaterial：浏览器普遍把后者线宽钳制为 1px，
        // 细线在 FXAA 下发虚、模糊；fat line 支持真实像素线宽 + 平滑抗锯齿，线条锐利清晰。
        const edgeLineMats=[];   // 收集所有特征线材质，渲染尺寸/像素比变化时同步更新 resolution
        function makeEdgeLine2(posArray, color, opts){
            opts=opts||{};
            const lg=new LineSegmentsGeometry();
            lg.setPositions(posArray);          // posArray 为成对顶点 [x,y,z,...]，与 LineSegments 一致
            const lm=new LineMaterial({color:color, linewidth:(opts.linewidth||1.5),
                transparent:!!opts.transparent, opacity:(opts.opacity!=null?opts.opacity:1)});
            const sz=renderer.getDrawingBufferSize(new THREE.Vector2());
            lm.resolution.set(sz.x, sz.y);      // 线宽以"像素"为单位，分辨率必须与实际绘制缓冲一致
            edgeLineMats.push(lm);

            if(opts.renderOrder!=null) l2.renderOrder=opts.renderOrder;
            return l2;
        }
        function updateEdgeLineResolution(){
            const sz=renderer.getDrawingBufferSize(new THREE.Vector2());
            edgeLineMats.forEach(m=>m.resolution.set(sz.x,sz.y));
        }
        function addFeatureEdges(edges){
            const pts=[];
            const MAX_PTS=200000; // 防超大模型 JSON 爆炸，硬性封顶
            let cnt=0;
            for(const e of (edges||[])){
                const v=e&&e.vertices; if(!v||v.length<6) continue;
                const seg=Math.floor((v.length-3)/3);
                for(let k=0;k+5<v.length && cnt<MAX_PTS;k+=3,cnt++){
                    pts.push(v[k],v[k+1],v[k+2],v[k+3],v[k+4],v[k+5]);
                }
            }
            if(!pts.length) return;
            edgeGroup.add(makeEdgeLine2(new Float32Array(pts), 0x2a2e35));
        }
        function addToScene(solid, idx, bigMode){
            const verts=solid.vertices, tris=solid.triangles;

            const hasBrep = !!(solid.edges && solid.edges.length);
            if(!verts||verts.length<3||!tris||tris.length<3)return null;
            const geo=new THREE.BufferGeometry();
            geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
            geo.setIndex(new THREE.BufferAttribute(new Uint32Array(tris),1));
            // 顶点焊接：缝合相邻面裂缝，避免边线把缝当边界画碎线、光照在缝处断裂发噪

            const mesh=new THREE.Mesh(geo,getMat(modelColor));

            // 结构体着色：几何克隆一次即可（不重建数据）
            const bm=new THREE.Mesh(geo.clone(),new THREE.MeshBasicMaterial({color:BODY_COLORS[idx%BODY_COLORS.length],side:THREE.DoubleSide}));
            bm.visible=false; bodyColGroup.add(bm);

            // 只保留主渲染，保证加载即时完成不卡死；小模型保留全部展示功能
            const sgrp=new THREE.Group(); sgrp.visible=false;
            const wm=new THREE.Mesh(geo.clone(),new THREE.MeshBasicMaterial({color:0,wireframe:true,transparent:true,opacity:.08}));wm.visible=false;wireGroup.add(wm);
            if(!bigMode){
                // 表面标注分组（按法向分上/下/侧）——改用分裂后的索引，保证与法线一致
                const pos0=geo.getAttribute('position'), idx=geo.getIndex(), kv={up:[],down:[],side:[]};
                for(let t=0;t<idx.count;t+=3){
                    const i0=idx.getX(t),i1=idx.getX(t+1),i2=idx.getX(t+2);
                    const ax=pos0.getX(i1)-pos0.getX(i0),ay=pos0.getY(i1)-pos0.getY(i0),az=pos0.getZ(i1)-pos0.getZ(i0);
                    const bx=pos0.getX(i2)-pos0.getX(i0),by=pos0.getY(i2)-pos0.getY(i0),bz=pos0.getZ(i2)-pos0.getZ(i0);
                    const nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx,len=Math.sqrt(nx*nx+ny*ny+nz*nz)||1,unz=nz/len;
                    const kind=unz>0.3?'up':(unz<-0.3?'down':'side');
                    kv[kind].push(pos0.getX(i0),pos0.getY(i0),pos0.getZ(i0),pos0.getX(i1),pos0.getY(i1),pos0.getZ(i1),pos0.getX(i2),pos0.getY(i2),pos0.getZ(i2));
                }
                const cols={up:0xff2d2d,down:0x2d6bff,side:0xff9100};
                for(const k of ['up','down','side']){

                if(!hasBrep){
                    try{
                        const eg=new THREE.EdgesGeometry(geo, 40);
                        // CAD 工程图：细黑特征边（折痕/孔/轮廓），浅灰面上清晰可见；用 fat line 保证锐利
                        edgeGroup.add(makeEdgeLine2(eg.getAttribute('position').array, 0x2a2e35));
                    }catch(err){/* ignore edge failure */}

            }

            addFeatureEdges(solid.edges);
            surfaceGroup.add(sgrp);
            const name=(solid.name&&solid.name!=='Shape')?solid.name:('实体 #'+(idx+1));
            const entry={mesh,bm,sgrp,name,visible:true,tris:tris.length/3,color:BODY_COLORS[idx%BODY_COLORS.length]};
            bodyEntries.push(entry);
            return entry;
        }

        /* ================= 渲染上传模型 ================= */
        /* 管件编号（输出文件名前缀）：24TK_1324-31_ROTATE_x_CW_90deg → 24TK_1324-31
           前端也用同一套规则，保证和后端一致；后端还会再兜一次底。 */
        function partNumberFromName(name){
            if(!name)return '';
            let base=String(name).replace(/\\/g,'/').split('/').pop();
            base=base.replace(/\.[^.]+$/,'');
            base=base.replace(/^[0-9a-f]{12}_/i,(m)=>/[a-f]/i.test(m)?'':m);   // 去掉 hex 存储前缀
            base=base.replace(/---/g,'_');
            const out=[];
            for(const tok of base.split(/[_\s]+/)){
                if(!tok)continue;
                const low=tok.toLowerCase().replace(/^[.\-]+|[.\-]+$/g,'');
                if(!low)continue;
                if(/^(rotate|rot|mirror|mir|cavity|punch|filled|fill|hollow|hollowed|closed|copy|model|part|product|output|final|ok|new|v)$/.test(low)
                   ||low.includes('rotate')||low.includes('mirror'))break;
                if(!/[0-9A-Za-z]/.test(tok))continue;              // 纯标点
                if(/[()\[\]{}]/.test(tok))continue;                // "(1)" / "---(1)" 序号
                out.push(tok.replace(/^[.\-_]+|[.\-_]+$/g,''));
            }
            return out.filter(Boolean).join('_')||base;
        }
        function autoFillPrefix(data){
            const pn=(data&&data.part_number)||partNumberFromName((data&&(data.file_name||data.filename))||'');
            if(!pn)return;
            window._partNumber=pn;
            for(const id of ['smPrefix','cdPrefix']){
                const el=document.getElementById(id);
                if(el)el.value=pn;
            }
        }
        function renderModel(data){
            loadSpin(true);
            setTimeout(()=>{try{
                clearAll();
                curModelPath=data.filepath||null;
                autoFillPrefix(data);      // 输出前缀自动填管件编号
                // 记录最近上传/查看的模型路径，供「装配·拼合」的产品结构体自动填入
                window._productPath=curModelPath;
                curInfo={name:data.file_name||'模型',size:data.bbox&&data.bbox.size?[data.bbox.size[0],data.bbox.size[1],data.bbox.size[2]]:[100,100,100]};
                const solids=data.solids||[];
                let all=[];
                for(const s of solids){const v=s.vertices;if(!v)continue;for(let i=0;i<v.length;i+=3)all.push(v[i],v[i+1],v[i+2]);}
                let cx=0,cy=0,cz=0;const n=all.length/3;
                if(n){for(let i=0;i<all.length;i+=3){cx+=all[i];cy+=all[i+1];cz+=all[i+2];}cx/=n;cy/=n;cz/=n;}
                // 先算总面数（纯读，极快），用于决定"大模型快速模式"与自适应渲染质量
                let totalT=0, i=0;
                for(const s of solids){ if(s.triangles) totalT += s.triangles.length/3; i++; }
                const bigMode = totalT > BIG_MODEL_TRIS;
                const centered=solids.map(s=>{
                    const v=s.vertices;
                    if(!v)return s;
                    const cv=new Float32Array(v.length);
                    for(let k=0;k<v.length;k+=3){cv[k]=v[k]-cx;cv[k+1]=v[k+1]-cy;cv[k+2]=v[k+2]-cz;}
                    // 大模型自动跳过 edges 居中（前端已改用 EdgesGeometry，不再使用该数据）
                    return {...s, vertices:Array.from(cv), edges: (s.edges||[]).map(e=>{
                        const ev=e.vertices;if(!ev)return e;
                        const ce=new Float32Array(ev.length);
                        for(let k=0;k<ev.length;k+=3){ce[k]=ev[k]-cx;ce[k+1]=ev[k+1]-cy;ce[k+2]=ev[k+2]-cz;}
                        return {...e,vertices:ce};
                    })};
                });
                centered.forEach((s,j)=>{const e=addToScene(s,j,bigMode);});
                adaptQuality(totalT);
                updateGround();
                const tb=document.getElementById('treeBox');tb.innerHTML='';
                bodyEntries.forEach((e,i)=>{
                    const row=document.createElement('div');row.className='tree-item';
                    row.innerHTML=`<span class="sw" style="background:#${e.color.toString(16).padStart(6,'0')}"></span><span class="nm">${e.name}</span><span class="tri">${Math.round(e.tris).toLocaleString()}</span><span class="eye" data-act="eye">👁</span><span class="lens" data-act="focus">◎</span>`;
                    row.addEventListener('click',ev=>{
                        const act=ev.target.dataset.act;
                        if(act==='eye'){e.visible=!e.visible;e.mesh.visible=e.visible;e.bm.visible=e.visible&&false;e.sgrp.visible=e.visible&&showMark&&false;ev.target.textContent=e.visible?'👁':'🚫';refreshMarks();return;}
                        if(act==='focus'){
                            bodyEntries.forEach(x=>{x.mesh.visible=(x===e);x.sgrp.visible=false;x.bm.visible=false;});
                            if(showMark){markCurrentOnly(e,i);}
                            tb.querySelectorAll('.tree-item').forEach(r=>r.classList.remove('sel'));
                            row.classList.add('sel');
                            const bb=new THREE.Box3().setFromObject(e.mesh);const c=bb.getCenter(new THREE.Vector3());
                            const d=bb.getSize(new THREE.Vector3()).length()*2;
                            controls.target.copy(c);camera.position.set(c.x+d*.6,c.y+d*.45,c.z+d);controls.update();
                            setStInfo('已聚焦：'+e.name);
                            return;
                        }
                        bodyEntries.forEach(x=>x.mesh.material= x===e? new THREE.MeshStandardMaterial({color:new THREE.Color(e.color),metalness:.1,roughness:.2,side:THREE.DoubleSide}):getMat(modelColor));
                        tb.querySelectorAll('.tree-item').forEach(r=>r.classList.remove('sel'));
                        row.classList.add('sel');
                    });
                    tb.appendChild(row);
                });
                document.getElementById('treeCount').textContent=bodyEntries.length+' 实体';
                const sz=curInfo.size;fit(Math.max(...sz));
                document.getElementById('stTri').textContent='三角面: '+totalT.toLocaleString();
                setStInfo(data.file_name||'模型');
            }catch(err){console.error(err);setStInfo('加载错误: '+err.message);}finally{loadSpin(false);}},60);
        }

        function refreshMarks(){
            if(!showMark){bodyEntries.forEach(e=>{e.sgrp.visible=false;e.bm.visible=false;});surfaceGroup.visible=true;return;}
            bodyEntries.forEach(e=>{e.sgrp.visible=e.mesh.visible;});
            bodyEntries.forEach(e=>e.bm.visible=false);
            surfaceGroup.visible=true;
        }
        function markCurrentOnly(e,i){
            bodyEntries.forEach((x,xj)=>{x.sgrp.visible=(xj===i);});
        }
        document.getElementById('markBtn').addEventListener('click',function(){
            showMark=!showMark;this.classList.toggle('active',showMark);

        /* ================= 面拾取属性 ================= */
        function initPick(){
            renderer.domElement.addEventListener('click',onPick);
        }
        function onPick(e){
            if(e.target!==renderer.domElement)return;
            const r=renderer.domElement.getBoundingClientRect();
            const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
            const ray=new THREE.Raycaster();ray.setFromCamera(m,camera);
            const hits=ray.intersectObjects(clickableMeshes);
            if(!hits.length){closeProp();return;}
            const h=hits[0];const bi=h.object.userData.bodyIndex;
            const entry=bodyEntries[bi];
            if(!entry)return;
            const fg=h.face; const p=h.point;
            const a=h.object.geometry.getAttribute('position');
            const ia=fg.a, ib=fg.b, ic=fg.c;
            const pa=new THREE.Vector3(a.getX(ia),a.getY(ia),a.getZ(ia));
            const pb=new THREE.Vector3(a.getX(ib),a.getY(ib),a.getZ(ib));
            const pc=new THREE.Vector3(a.getX(ic),a.getY(ic),a.getZ(ic));
            const area=pa.clone().sub(pb).cross(pa.clone().sub(pc)).length()/2;
            const nn=pa.clone().sub(pb).cross(pa.clone().sub(pc)).normalize();
            const kind = nn.z>0.3?'上表面(🔴)':(nn.z<-0.3?'下表面(🔵)':'侧壁(🟠)');
            const prop=document.getElementById('propBody');
            prop.innerHTML=
                `<div class="row"><span class="k">所属结构体</span><span class="v" style="color:#${entry.color.toString(16).padStart(6,'0')}">${entry.name}</span></div>`+
                `<div class="row"><span class="k">拾取点</span><span class="v">(${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)})</span></div>`+
                `<div class="row"><span class="k">面类型</span><span class="v">${kind}</span></div>`+
                `<div class="row"><span class="k">三角面面积</span><span class="v">${area.toFixed(2)} mm²</span></div>`+
                `<div class="row"><span class="k">面法向</span><span class="v">(${nn.x.toFixed(2)}, ${nn.y.toFixed(2)}, ${nn.z.toFixed(2)})</span></div>`+
                `<div class="row"><span class="k">结构体三角面</span><span class="v">${Math.round(entry.tris).toLocaleString()}</span></div>`;
            document.getElementById('propPanel').style.display='block';
            bodyEntries.forEach(x=>x.mesh.material=getMat(modelColor));
            entry.mesh.material=new THREE.MeshStandardMaterial({color:new THREE.Color(0x4f8cf7),metalness:.1,roughness:.2,side:THREE.DoubleSide});
            setStInfo('已选中 '+entry.name+' 的面');
        }
        function closeProp(){document.getElementById('propPanel').style.display='none';bodyEntries.forEach(x=>x.mesh.material=getMat(modelColor));}
        window.closeProp=closeProp;

        /* ================= 工具按钮 ================= */

            setStInfo(panMode?'✥ 平移模式：左键拖动平移（关闭旋转）':'操作模式：左键旋转');

        let liveMode=false, liveMat=null;
        function resetLive(){ if(liveMat){liveMat.dispose();liveMat=null;} bodyEntries.forEach(x=>{x.mesh.material=getMat(modelColor);}); }
        function onLiveMove(e){
            if(!curInfo)return;
            const r=renderer.domElement.getBoundingClientRect();

            if(!hits.length){resetLive();return;}
            const h=hits[0];const bi=h.object.userData.bodyIndex;const entry=bodyEntries[bi];if(!entry)return;
            if(!liveMat){liveMat=new THREE.MeshStandardMaterial({color:new THREE.Color(0x4f8cf7),metalness:.1,roughness:.2,side:THREE.DoubleSide,transparent:true,opacity:.55});}

        document.getElementById('matBtn').onclick=function(){

            core_design:{t:'🧩 模芯设计（芯棒 / 内芯）',html:()=>`

                    <input type="checkbox" id="cdExact"> 精确布尔校验啃料（默认用免费的"站位截面对比"；勾选后 +20 min 量级）

            optimize:{t:'🔧 产品优化（端角闭合）',html:()=>`                <div style="font-size:12px;background:var(--primary-bg);border-radius:7px;padding:8px;color:var(--primary-dark);margin-bottom:6px">
                  闭合产品<b>两端折弯角开口</b>：两条折弯边自然延伸交尖角 + R 折弯圆角，恢复标准折弯角落。
                </div>
                <label class="f">折弯圆角半径 (mm)</label>
                <input type="number" id="opFillet" value="3" min="0.5" max="10" step="0.5">
                <button class="btn" id="opBtn">🔧 执行端角闭合优化</button>
                <div class="status-msg" id="panelStatus"></div>
                <div style="font-size:12px;background:var(--primary-bg);border-radius:7px;padding:8px;margin-top:12px;color:var(--primary-dark)" id="opRes"></div>
                <a class="btn" id="opLink" style="display:none;text-decoration:none" target="_blank">⬇️ 下载优化后模型</a>`},
        };
        let curPanel=null;
        const panelEl = document.getElementById('panels');
        const backdropEl = document.getElementById('panelBackdrop');
        function openPanel(name){
            const p=PANELS[name];if(!p)return;
            curPanel=name;
            document.getElementById('panelTitle').textContent=p.t;
            document.getElementById('panelBody').innerHTML=p.html();
            panelEl.classList.add('show');
            backdropEl.classList.add('show');
            document.querySelectorAll('.ha-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));
            document.querySelectorAll('.fn-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));
            bindPanel(name);
        }
        function closePanel(){
            panelEl.classList.remove('show');
            backdropEl.classList.remove('show');
            document.querySelectorAll('.ha-btn').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.fn-btn').forEach(b=>b.classList.remove('active'));
            curPanel=null;
        }
        window.closePanel=closePanel;
        document.addEventListener('keydown',e=>{
            if(e.key==='Escape'&&panelEl.classList.contains('show')){closePanel();e.stopPropagation();}
        });
        function togglePanel(name){
            if(curPanel===name){closePanel();return;}
            openPanel(name);
        }
        document.querySelectorAll('.ha-btn').forEach(b=>b.onclick=()=>togglePanel(b.dataset.panel));
        document.querySelectorAll('.fn-btn').forEach(b=>b.onclick=()=>togglePanel(b.dataset.panel));

        function bindPanel(name){
            if(name==='upload'){
                const area=document.getElementById('upArea'),file=document.getElementById('upFile');
                area.onclick=()=>file.click();
                area.ondragover=e=>{e.preventDefault();area.style.borderColor='var(--primary)';};
                area.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files.length)doUpload(e.dataTransfer.files[0]);};
                file.onchange=()=>file.files.length&&doUpload(file.files[0]);
            }
            if(name==='measure'){
                let pts=[];const ln=new THREE.Group();scene.add(ln);
                const startBtn=document.getElementById('msStart');
                const doStart=()=>{
                    pts=[];
                    if(curPanel!=='measure')return;
                    startBtn.textContent='🔴 测量中...';
                    const onC=e=>{
                        const r=renderer.domElement.getBoundingClientRect();const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
                        const ray=new THREE.Raycaster();ray.setFromCamera(m,camera);const hits=ray.intersectObjects(clickableMeshes);
                        if(!hits.length)return;
                        const p=hits[0].point.clone();pts.push(p);
                        const sp=new THREE.Mesh(new THREE.SphereGeometry(1.6,12,12),new THREE.MeshBasicMaterial({color:0x4f8cf7}));sp.position.copy(p);scene.add(sp);ln.add(sp);
                        if(pts.length>=2){
                            const d=pts[pts.length-2].distanceTo(pts[pts.length-1]);
                            const lg=new THREE.BufferGeometry().setFromPoints([pts[pts.length-2],pts[pts.length-1]]);
                            const line=new THREE.Line(lg,new THREE.LineDashedMaterial({color:0x4f8cf7,dashSize:2,gapSize:1.5}));line.computeLineDistances();scene.add(line);ln.add(line);
                            const cc=document.createElement('canvas');cc.width=256;cc.height=64;const c2=cc.getContext('2d');c2.fillStyle='rgba(255,255,255,.9)';c2.fillRect(0,0,256,64);c2.strokeStyle='#4f8cf7';c2.lineWidth=2;c2.strokeRect(0,0,256,64);c2.fillStyle='#4f8cf7';c2.font='Bold 26px Arial';c2.textAlign='center';c2.textBaseline='middle';c2.fillText(d.toFixed(2)+' mm',128,34);
                            const tx=new THREE.CanvasTexture(cc),lab=new THREE.Sprite(new THREE.SpriteMaterial({map:tx}));lab.scale.set(24,6,1);lab.position.copy(pts[pts.length-2].clone().add(pts[pts.length-1]).multiplyScalar(.5)).add(new THREE.Vector3(0,5,0));scene.add(lab);ln.add(lab);
                            document.getElementById('panelStatus').textContent='长度 '+d.toFixed(2)+' mm（已记录）';
                        }
                    };
                    renderer.domElement.addEventListener('click',onC);
                    renderer.domElement.onmousemove=e=>{const r=renderer.domElement.getBoundingClientRect();const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);const ray=new THREE.Raycaster();ray.setFromCamera(m,camera);renderer.domElement.style.cursor=ray.intersectObjects(clickableMeshes).length?'crosshair':'default';};
                    window._stopMs=()=>{renderer.domElement.removeEventListener('click',onC);startBtn.textContent='🎯 开始测量';};
                };
                startBtn.onclick=()=>{if(startBtn.textContent.includes('测量中')){window._stopMs&&window._stopMs();}else doStart();};
                document.getElementById('msClear').onclick=()=>{window._stopMs&&window._stopMs();while(ln.children.length){const c=ln.children[0];if(c.geometry)c.geometry.dispose();scene.remove(c);ln.remove(c);}document.getElementById('panelStatus').textContent='当前值: —';};
            }
            if(name==='cutplane'){
                const dirSel=document.getElementById('cpDir'),rng=document.getElementById('cpRange'),v=document.getElementById('cpV');
                rng.oninput=()=>{v.textContent=(parseFloat(rng.value)/500*100).toFixed(1);};
                document.getElementById('cpBtn').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err');return;}
                    const dir=dirSel.value,norm=dir==='z'?[0,0,1]:dir==='y'?[0,1,0]:[1,0,0];
                    const frac=parseFloat(rng.value)/1000;
                    const bb=new THREE.Box3().setFromObject(modelGroup);
                    const min=bb.min,max=bb.max;
                    const origin=[(min.x+max.x)/2,(min.y+max.y)/2,(min.z+max.z)/2];
                    origin[dir==='z'?2:dir==='y'?1:0]=min[dir==='z'?2:dir==='y'?1:0]+(max[dir==='z'?2:dir==='y'?1:0]-min[dir==='z'?2:dir==='y'?1:0])*frac;
                    showStatus('计算中...','info');
                    try{
                        const resp=await fetch('/api/slice_plane?file='+encodeURIComponent(curModelPath)+'&origin='+origin.map(o=>o.toFixed(3)).join(',')+'&normal='+norm.join(','));
                        const data=await resp.json();if(data.error)throw new Error(data.error);
                        showStatus('展开长度 '+(data.best_length||data.arc_lengths?.reduce((a,b)=>a+b,0)||0).toFixed(2)+' mm（'+(data.contours_3d?.length||0)+' 条轮廓）','ok');
                    }catch(e){showStatus('失败: '+e.message,'err');}
                };
            }
            if(name==='mold'){
                document.getElementById('mdGen').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err',document.getElementById('panelStatus'));return;}
                    showStatus('生成中（30秒-2分钟）...','info');
                    try{
                        const resp=await fetch('/api/generate_mold',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:curModelPath,side_margin:parseFloat(document.getElementById('mdMargin').value)||10,base_thickness:parseFloat(document.getElementById('mdThick').value)||10})});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        const inf=d.info;
                        document.getElementById('mdRes').innerHTML='✅ 模具已生成<br>📦 产品 '+inf.product_size[0].toFixed(0)+'×'+inf.product_size[1].toFixed(0)+'×'+inf.product_size[2].toFixed(0)+' mm<br>🔻 凹模 '+inf.cavity_size[0].toFixed(0)+'×'+inf.cavity_size[1].toFixed(0)+'×'+inf.cavity_size[2].toFixed(0)+' mm<br>🔺 凸模 '+inf.punch_size[0].toFixed(0)+'×'+inf.punch_size[1].toFixed(0)+'×'+inf.punch_size[2].toFixed(0)+' mm<br><a href="/api/download_mold?file='+encodeURIComponent(d.cavity)+'" style="color:var(--primary)">⬇️ 凹模</a> &nbsp; <a href="/api/download_mold?file='+encodeURIComponent(d.punch)+'" style="color:var(--primary)">⬇️ 凸模</a>';
                        showStatus('模具生成完成！','ok');
                        window._moldFiles={cavity:d.cavity,punch:d.punch};
                    }catch(e){showStatus('失败:'+e.message,'err');}
                };
                document.getElementById('fxBtn').onclick=async()=>{
                    const t=document.getElementById('fxTarget').value;if(!t){showStatus('请选择修复对象','err',document.getElementById('panelStatus2'));return;}
                    const f=window._moldFiles?window._moldFiles[t]:null;if(!f){showStatus('请先生成模具','err',document.getElementById('panelStatus2'));return;}
                    const btn=document.getElementById('fxBtn');
                    btn.disabled=true;btn.textContent='⏳ 修复中...';
                    showStatus('修复中...（凸模补齐约 2~4 分钟，凹模挖空约 1~2 分钟，请耐心等待）','info',document.getElementById('panelStatus2'));
                    document.getElementById('fxLink').style.display='none';
                    const ctl=new AbortController();
                    const timer=setTimeout(()=>ctl.abort(),600*1000);
                    try{
                        const resp=await fetch('/api/fix_mold',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:f,operation:t==='punch'?'fill':'hollow',product_filepath:curModelPath}),signal:ctl.signal});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        const l=document.getElementById('fxLink');l.href='/api/download_fix?file='+encodeURIComponent(d.output_path);l.style.display='block';
                        showStatus('修复完成！','ok',document.getElementById('panelStatus2'));
                    }catch(e){
                        if(e.name==='AbortError')showStatus('❌ 修复超时（超过10分钟）。请确认服务器正在运行，或在 fix_output 目录查看是否已生成文件','err',document.getElementById('panelStatus2'));
                        else showStatus('失败: '+e.message,'err',document.getElementById('panelStatus2'));
                    }finally{
                        clearTimeout(timer);
                        btn.disabled=false;btn.textContent='🔧 执行修复';
                    }
                };
            }
            if(name==='mirror'){
                const doMirror=document.getElementById('mrDoMirror');
                const doRotate=document.getElementById('mrDoRotate');
                const syncMr=()=>{
                    document.getElementById('mrPlane').disabled=!doMirror.checked;
                    document.getElementById('mrCenter').disabled=!doMirror.checked;
                    document.getElementById('mrAxis').disabled=!doRotate.checked;
                    document.getElementById('mrDir').disabled=!doRotate.checked;
                    document.getElementById('mrDeg').disabled=!doRotate.checked;
                    document.getElementById('mrRotCenter').disabled=!doRotate.checked;
                };
                doMirror.onchange=syncMr;doRotate.onchange=syncMr;syncMr();
                document.getElementById('mrBtn').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err');return;}
                    const mir=doMirror.checked, rot=doRotate.checked;
                    if(!mir&&!rot){showStatus('镜像和旋转至少要选一个','err');return;}
                    const deg=parseFloat(document.getElementById('mrDeg').value||'0');
                    if(rot&&!(deg>0&&deg<=360)){showStatus('旋转角度需在 0~360 度之间','err');return;}
                    showStatus('生成中...','info');
                    try{
                        const body={filepath:curModelPath,mirror:mir,rotate:rot,
                            plane:document.getElementById('mrPlane').value,
                            center_on_centroid:document.getElementById('mrCenter').checked,
                            axis:document.getElementById('mrAxis').value,
                            direction:document.getElementById('mrDir').value,
                            degrees:deg,
                            rotate_about_centroid:document.getElementById('mrRotCenter').checked};
                        const resp=await fetch('/api/generate_mirror',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
                        const d=await resp.json();if(d.error)throw new Error(d.error);
                        const l=document.getElementById('mrLink');l.href='/api/download_mirror?file='+encodeURIComponent(d.output_path);l.style.display='block';

            }
            if(name==='optimize'){
                document.getElementById('opBtn').onclick=async()=>{
                    if(!curModelPath){showStatus('请先上传模型','err');return;}
                    const fillet=+document.getElementById('opFillet').value||3;
                    const btn=document.getElementById('opBtn');
                    btn.disabled=true;btn.textContent='⏳ 优化中...';
                    showStatus('闭合端角优化中...','info');
                    document.getElementById('opRes').innerHTML='';
                    try{
                        const resp=await fetch('/api/optimize_corners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:curModelPath,fillet_r:fillet})});
                        const d=await resp.json();
                        if(d.error)throw new Error(d.error);
                        const vb=d.volume_before_mm3||0,va=d.volume_after_mm3||0;
                        document.getElementById('opRes').innerHTML='✅ 端角闭合完成（R'+fillet.toFixed(1)+' mm）<br>📦 体积 '+vb.toFixed(0)+' → '+va.toFixed(0)+' mm³（+'+(va-vb).toFixed(0)+' 材料）<br>👁 已在 3D 视图显示优化后模型';
                        const l=document.getElementById('opLink');l.href='/api/download_opt?file='+encodeURIComponent(d.optimized_path);l.style.display='block';
                        showStatus('优化完成！','ok');
                        if(typeof renderModel==='function'&&d.solids){renderModel({...d,file_name:curInfo?curInfo.name:'产品优化',filepath:d.optimized_path});}
                    }catch(e){showStatus('失败: '+e.message,'err');}
                    finally{btn.disabled=false;btn.textContent='🔧 执行端角闭合优化';}
                };
            }
        }

        /* 在 3D 查看器中预览生成的 STEP 文件（上模/下模等） */
        async function viewStepFile(path,name,transparent){
            loadSpin(true);
            try{
                const resp=await fetch('/api/model_parse?file='+encodeURIComponent(path));
                const data=await resp.json();
                if(data.error)throw new Error(data.error);
                lastFullData=data; lastSectionName=name;
                renderModel(data);
                setStInfo('已加载：'+name);
                if(transparent){
                    bodyEntries.forEach(e=>{
                        if(e.mesh&&e.mesh.material){
                            e.mesh.material.transparent=true;
                            e.mesh.material.opacity=0.4;
                            e.mesh.material.depthWrite=false;
                            e.mesh.material.side=THREE.DoubleSide;
                        }
                    });
                }
                showStatus('✅ 已在查看器中加载 '+name+'，可旋转 / 测量 / 剖切','ok');
            }catch(e){
                showStatus('预览失败: '+e.message,'err');
            }finally{loadSpin(false);}
        }

        /* 半剖预览：沿指定方向切去一半，直接看到内部型腔剖面 */
        async function viewSectionFile(path,name,axis,ratio){
            loadSpin(true);
            try{
                const q=new URLSearchParams({file:path});
                if(axis)q.set('axis',axis);
                if(ratio!=null)q.set('ratio',ratio);
                const resp=await fetch('/api/model_section?'+q.toString());
                const data=await resp.json();
                if(data.error)throw new Error(data.error);
                renderModel(data);
                setStInfo('已加载：'+name+'（半剖视图）');
                showStatus('✅ 半剖视图：可看到模芯内部的型腔剖面','ok');
            }catch(e){
                showStatus('剖视失败: '+e.message,'err');
            }finally{loadSpin(false);}
        }

        async function doUpload(file){
            const ext=file.name.split('.').pop().toLowerCase();
            if(!['stp','step','stl'].includes(ext)){showStatus('仅支持 STP/STEP/STL','err');return;}
            loadSpin(true);showStatus('上传中...','info');
            const ctl=new AbortController();
            const timer=setTimeout(()=>ctl.abort(),75*1000);
            try{
                const fd=new FormData();fd.append('file',file);
                const resp=await fetch('/upload',{method:'POST',body:fd,signal:ctl.signal});
                clearTimeout(timer);
                const data=await resp.json();if(data.error)throw new Error(data.error);
                lastFullData=data; lastSectionName=data.file_name||'模型';
                renderModel(data);
                showStatus('已加载 '+(data.face_count||0)+' 个面','ok');
            }catch(e){
                clearTimeout(timer);
                if(e.name==='AbortError')showStatus('❌ 上传超时（服务器解析太久已放弃）。建议：在 CAD 中精简模型，或导出为 STL 再上传','err');
                else showStatus('❌ '+e.message,'err');
            }
            finally{loadSpin(false);}
        }

        /* ================= 动画 ================= */
        function animate(){requestAnimationFrame(animate);controls.update();composer.render();}
        animate();
        function demoBox(){
            const geo=new THREE.BoxGeometry(100,50,30);
            const mesh=new THREE.Mesh(geo,getMat(modelColor));mesh.userData.isModel=true;modelGroup.add(mesh);clickableMeshes.push(mesh);
            const eg=new THREE.EdgesGeometry(geo);const el=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x556677,transparent:true,opacity:.4}));edgeGroup.add(el);
            curInfo={name:'演示长方体',size:[100,50,30]};fit(100);
        }
        demoBox();
        console.log('3D Viewer v3');
    </script>
</body>
